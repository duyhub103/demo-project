spring:
  application:
    name: pharma-wms
  profiles:
    active: h2

  datasource:
    url: jdbc:postgresql://localhost:5432/pharma_wms
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Ho_Chi_Minh

server:
  port: 8080

jwt:
  secret: pharmaWMSSecretKey2024VeryLongSecretKeyForJWTSigning123456789ABCDEF
  expiration: 86400000  # 24 hours in milliseconds
  refresh-expiration: 604800000  # 7 days

app:
  warehouse:
    expiry-warning-days: 90  # Cảnh báo lô cận hạn trước 90 ngày

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    com.pharma.wms: DEBUG
    org.springframework.security: INFO
